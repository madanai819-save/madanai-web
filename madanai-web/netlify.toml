# Individual blog articles: /blog/<slug> and /blog/<slug>/ -> /blog/<slug>.html
# Wildcard rules only apply when no exact static file matches the request
# (force is intentionally omitted/false here), so requests for real files like
# /blog/restaurant-ai.html continue to be served directly without redirecting.
[[redirects]]
  from = "/blog/*/"
  to = "/blog/:splat.html"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 301
